<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sleek Squircle Outer Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#logoBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  
  <!-- Subtle Architectural Grid Accent Lines -->
  <path d="M2 32H62 M32 2V62" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Shield Apex / Security Contour (Minimalist 1px) -->
  <path d="M32 10 L48 18 V34 C48 44 32 52 32 52 C32 52 16 44 16 34 V18 Z" fill="rgba(59, 130, 246, 0.06)" stroke="url(#brandGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Geometric Modern Monogram: "W" and "B" Integrated -->
  <!-- "W" Left Wing -->
  <path d="M22 23 L26 37 L30 25 L34 37 L38 23" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Security Verification Node (Emerald Pulse) -->
  <circle cx="48" cy="16" r="3" fill="url(#accentGrad)" stroke="#0f172a" stroke-width="1.5"/>
</svg>