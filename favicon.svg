<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background cyber-glow filter -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="cyberBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tuxBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Circular Rounded Cyber Baseplate (Looks stunning on dark and light browser tabs) -->
  <rect width="128" height="128" rx="32" fill="url(#cyberBg)" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Tux Linux Penguin Body -->
  <!-- Feet -->
  <ellipse cx="44" cy="112" rx="20" ry="8" fill="url(#beakGrad)" transform="rotate(-8 44 112)"/>
  <ellipse cx="84" cy="112" rx="20" ry="8" fill="url(#beakGrad)" transform="rotate(8 84 112)"/>
  <!-- Foot claws/details -->
  <path d="M 30 114 Q 44 118 58 114" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 70 114 Q 84 118 98 114" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Left & Right Flippers / Wings -->
  <ellipse cx="28" cy="74" rx="12" ry="26" fill="url(#tuxBody)" transform="rotate(24 28 74)"/>
  <ellipse cx="100" cy="74" rx="12" ry="26" fill="url(#tuxBody)" transform="rotate(-24 100 74)"/>

  <!-- Main Body / Head Base -->
  <ellipse cx="64" cy="76" rx="34" ry="38" fill="url(#tuxBody)"/>
  <circle cx="64" cy="42" r="26" fill="url(#tuxBody)"/>

  <!-- White Belly -->
  <path d="M 44 64 C 40 84, 40 102, 64 105 C 88 102, 88 84, 84 64 C 80 54, 48 54, 44 64 Z" fill="#f8fafc"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="53" cy="38" rx="6.5" ry="9" fill="#ffffff"/>
  <ellipse cx="54.5" cy="38.5" rx="3.5" ry="5" fill="#0f172a"/>
  <circle cx="53" cy="36" r="1.5" fill="#ffffff"/>

  <!-- Right Eye -->
  <ellipse cx="75" cy="38" rx="6.5" ry="9" fill="#ffffff"/>
  <ellipse cx="73.5" cy="38.5" rx="3.5" ry="5" fill="#0f172a"/>
  <circle cx="72" cy="36" r="1.5" fill="#ffffff"/>

  <!-- Tux Beak -->
  <path d="M 48 45 Q 64 41 80 45 Q 74 58 64 61 Q 54 58 48 45 Z" fill="url(#beakGrad)"/>
  <path d="M 52 46 Q 64 50 76 46" stroke="#b45309" stroke-width="1.5" fill="none"/>

  <!-- Cyber Linux Accent (Subtle Neon Cyan Fedora / Red Hat / Cyber Status Pip) -->
  <circle cx="104" cy="24" r="5" fill="#10b981"/>
  <circle cx="104" cy="24" r="8" fill="#10b981" fill-opacity="0.3"/>
</svg>
